name: Collect digital IC literature

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: digital-ic-feed-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install project and test dependencies
        run: python -m pip install ".[dev]"

      - name: Test before collection
        run: python -m pytest -q

      - name: Collect digital IC literature
        id: collect
        continue-on-error: true
        env:
          IEEE_API_KEY: ${{ secrets.IEEE_API_KEY }}
        run: python -m ic_feed.collect --config paper_feed_config.json --state state.json

      - name: Validate collected publication
        id: validate
        if: ${{ always() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure') }}
        continue-on-error: true
        run: python -m ic_feed.validate

      - name: Commit and push collection outputs
        if: ${{ always() && (steps.collect.outcome == 'failure' || (steps.collect.outcome == 'success' && steps.validate.outcome == 'success')) }}
        shell: bash
        env:
          COLLECTION_OUTCOME: ${{ steps.collect.outcome }}
          PUBLICATION_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          allowed_outputs=(
            "filtered_feed.xml"
            "state.json"
            "fetch_failures.tsv"
          )
          if [[ "${COLLECTION_OUTCOME}" == "failure" ]]; then
            allowed_outputs=("fetch_failures.tsv")
            if [[ "${PUBLICATION_OUTCOME}" == "success" ]]; then
              allowed_outputs+=("state.json")
            fi
          fi
          existing_outputs=()
          for output in "${allowed_outputs[@]}"; do
            if [[ -e "${output}" ]] || git ls-files --error-unmatch -- "${output}" > /dev/null 2>&1; then
              existing_outputs+=("${output}")
            fi
          done
          if (( ${#existing_outputs[@]} > 0 )); then
            git add -- "${existing_outputs[@]}"
          fi
          if git diff --cached --quiet; then
            echo "No collection output changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: update collected digital IC literature"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Propagate collection failure
        if: ${{ always() && (steps.collect.outcome == 'failure' || steps.validate.outcome == 'failure') }}
        run: exit 1
