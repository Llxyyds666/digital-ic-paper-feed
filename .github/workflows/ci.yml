name: Test digital IC feed

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'pyproject.toml'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digital-ic-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install project and test dependencies
        run: python -m pip install ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Validate publication
        run: python -m ic_feed.validate
