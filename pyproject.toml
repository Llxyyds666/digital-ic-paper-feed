[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-ic-paper-feed"
version = "0.1.0"
description = "Digital IC design and verification literature feeds"
requires-python = ">=3.11"
dependencies = ["feedparser>=6.0.11,<7", "curl-cffi>=0.13,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
